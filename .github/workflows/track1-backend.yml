name: Track 1 backend
on:
  push:
    paths: ['backend/**', 'docs/openapi.json', '.github/workflows/track1-backend.yml']
  pull_request:
    paths: ['backend/**', 'docs/openapi.json', '.github/workflows/track1-backend.yml']
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q setu_backend
        working-directory: backend
      - run: python -m unittest discover -s tests -v
        working-directory: backend
      - name: Verify exported API contract
        working-directory: backend
        run: |
          python -c "import json; from pathlib import Path; from setu_backend.openapi import specification; assert json.loads(Path('../docs/openapi.json').read_text()) == specification()"
