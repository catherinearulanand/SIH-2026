[project]
name = "setu-supply"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.150.0",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pydantic>=2.5.0",
    "scipy>=1.18.1",
    "uvicorn>=0.27.0",
]

[dependency-groups]
dev = [
    "httpx>=0.26.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["setu"]

