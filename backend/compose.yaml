services:
  backend:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - setu-data:/data
    environment:
      SETU_CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  setu-data:
